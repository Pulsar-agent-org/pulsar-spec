name: Bug report
description: Report an error or contradiction in the specification or vectors
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use private reporting as
        described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What is wrong
      description: The section or vector, and how it contradicts itself or the intent.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: File and section, for example spec/protocol.md section 6.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spec version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "protocol"
        - "conformance"
        - "contracts"
        - "docs"
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is not a security vulnerability. Security issues go to SECURITY.md.
          required: true
